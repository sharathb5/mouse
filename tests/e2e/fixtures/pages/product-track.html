<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trackable Lamp</title>
    <meta property="og:type" content="product" />
    <meta property="og:title" content="Trackable Lamp" />
    <meta property="og:url" content="http://127.0.0.1:4321/product-track.html" />
    <meta property="product:price:amount" content="100.00" />
    <meta property="product:price:currency" content="USD" />
    <meta property="product:availability" content="in-stock" />
    <script type="application/ld+json" id="product-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Trackable Lamp",
        "offers": {
          "@type": "Offer",
          "price": "100.00",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock",
          "url": "http://127.0.0.1:4321/product-track.html"
        }
      }
    </script>
  </head>
  <body>
    <h1 id="title">Trackable Lamp</h1>
    <p>
      Price: $<span id="price">100.00</span> —
      <span id="availability">in-stock</span>
    </p>
    <script>
      window.__pageEvents = { contextmenu: [], clicks: 0, keydowns: [] };
      // Allow tests to mutate the live DOM (and JSON-LD) without a navigation.
      window.__setTrackState = ({ price, availability }) => {
        if (price !== undefined) {
          document.getElementById('price').textContent = String(price);
          document
            .querySelector('meta[property="product:price:amount"]')
            .setAttribute('content', String(price));
        }
        if (availability !== undefined) {
          document.getElementById('availability').textContent = availability;
          document
            .querySelector('meta[property="product:availability"]')
            .setAttribute('content', availability);
        }
        const payload = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          name: 'Trackable Lamp',
          offers: {
            '@type': 'Offer',
            price: String(price ?? document.getElementById('price').textContent),
            priceCurrency: 'USD',
            availability:
              (availability ?? document.getElementById('availability').textContent) ===
              'out-of-stock'
                ? 'https://schema.org/OutOfStock'
                : 'https://schema.org/InStock',
            url: 'http://127.0.0.1:4321/product-track.html',
          },
        };
        document.getElementById('product-jsonld').textContent = JSON.stringify(payload);
      };
    </script>
  </body>
</html>
